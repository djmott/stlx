name: Scheduled Analysis

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # Comprehensive Analysis
  comprehensive-analysis:
    name: Comprehensive Analysis - ${{ matrix.platform }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            compiler: gcc-13
            sanitizer: Address
          - platform: ubuntu-latest
            compiler: clang-17
            sanitizer: UndefinedBehavior
          - platform: windows-latest
            compiler: msvc
            sanitizer: None
          - platform: macos-latest
            compiler: clang
            sanitizer: Address

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ${{ matrix.compiler }} \
          cmake \
          ninja-build \
          valgrind \
          cppcheck \
          clang-tidy \
          clang-format \
          python3-pip
        pip install gcovr cpplint

    - name: Install dependencies (macOS)
      if: matrix.platform == 'macos-latest'
      run: |
        brew install cmake ninja valgrind cppcheck clang-format
        pip3 install gcovr cpplint

    - name: Install dependencies (Windows)
      if: matrix.platform == 'windows-latest'
      run: |
        choco install python3
        pip install cpplint

    - name: Set up MSVC (Windows)
      if: matrix.platform == 'windows-latest'
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: 2022

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        if [ "${{ matrix.platform }}" = "windows-latest" ]; then
          cmake .. \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSANITIZER_TYPE=${{ matrix.sanitizer }} \
            -DENABLE_COVERAGE=ON \
            -DENABLE_CLANG_TIDY=ON \
            -DENABLE_CPPCHECK=ON \
            -DENABLE_CPPLINT=ON \
            -DENABLE_IWYU=ON
        else
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DSANITIZER_TYPE=${{ matrix.sanitizer }} \
            -DENABLE_COVERAGE=ON \
            -DENABLE_CLANG_TIDY=ON \
            -DENABLE_CPPCHECK=ON \
            -DENABLE_CPPLINT=ON \
            -DENABLE_IWYU=ON
        fi

    - name: Build
      run: |
        cd build
        if [ "${{ matrix.platform }}" = "windows-latest" ]; then
          cmake --build . --config ${{ env.BUILD_TYPE }} --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
        else
          ninja -j${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
        fi

    - name: Run Tests
      run: |
        cd build
        if [ "${{ matrix.platform }}" = "windows-latest" ]; then
          ctest --output-on-failure --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }} -C ${{ env.BUILD_TYPE }}
        else
          ctest --output-on-failure --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
        fi

    - name: Run All Static Analysis
      run: |
        cd build
        if [ "${{ matrix.platform }}" = "windows-latest" ]; then
          cmake --build . --target cpplint || true
        else
          ninja cppcheck cpplint clang-tidy-report iwyu || true
        fi

    - name: Run Dynamic Analysis
      if: matrix.platform != 'windows-latest'
      run: |
        cd build
        ninja valgrind-tests || true

    - name: Generate Coverage Report
      run: |
        cd build
        if [ "${{ matrix.platform }}" != "windows-latest" ]; then
          ninja coverage_html || true
        fi

    - name: Upload Comprehensive Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: comprehensive-analysis-${{ matrix.platform }}-${{ matrix.compiler }}-${{ matrix.sanitizer }}
        path: |
          build/reports/
          build/coverage/
        retention-days: 90

  # Performance Benchmarking
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-13 \
          cmake \
          ninja-build \
          python3-pip
        pip install gcovr

    - name: Configure CMake (Release)
      run: |
        mkdir -p build-release
        cd build-release
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc-13 \
          -DCMAKE_CXX_COMPILER=gcc-13 \
          -DSANITIZER_TYPE=None \
          -DENABLE_COVERAGE=OFF

    - name: Build Release
      run: |
        cd build-release
        ninja -j${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

    - name: Run Performance Tests
      run: |
        cd build-release
        # Run tests multiple times for performance analysis
        for i in {1..5}; do
          echo "Run $i:"
          time ./bin/stlx_tests --gtest_filter="*Performance*" || true
        done

    - name: Upload Performance Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-benchmark-results
        path: build-release/
        retention-days: 30

  # Generate Analysis Summary
  analysis-summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [comprehensive-analysis, performance-benchmark]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all analysis results
      uses: actions/download-artifact@v4
      with:
        path: analysis-results/

    - name: Generate Analysis Summary
      run: |
        cat > analysis-summary.md << 'EOF'
        # Weekly Analysis Summary
        
        Generated on: $(date)
        
        ## Analysis Results
        
        ### Static Analysis
        EOF
        
        # Count analysis results
        find analysis-results/ -name "*.xml" | wc -l | xargs echo "Total XML reports:" >> analysis-summary.md
        find analysis-results/ -name "*.txt" | wc -l | xargs echo "Total TXT reports:" >> analysis-summary.md
        
        echo "" >> analysis-summary.md
        echo "### Coverage Reports" >> analysis-summary.md
        find analysis-results/ -name "*.html" | wc -l | xargs echo "Total HTML coverage reports:" >> analysis-summary.md
        
        echo "" >> analysis-summary.md
        echo "### Performance Results" >> analysis-summary.md
        find analysis-results/ -name "*performance*" | wc -l | xargs echo "Performance benchmark runs:" >> analysis-summary.md
        
        echo "" >> analysis-summary.md
        echo "## Recommendations" >> analysis-summary.md
        echo "" >> analysis-summary.md
        echo "Based on this week's analysis:" >> analysis-summary.md
        echo "- Review any new static analysis warnings" >> analysis-summary.md
        echo "- Check coverage trends" >> analysis-summary.md
        echo "- Monitor performance benchmarks" >> analysis-summary.md

    - name: Upload Analysis Summary
      uses: actions/upload-artifact@v4
      with:
        name: weekly-analysis-summary
        path: analysis-summary.md
        retention-days: 365
