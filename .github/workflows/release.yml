name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

env:
  BUILD_TYPE: Release
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # Build and Test on All Platforms
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-13
            sanitizer: None
            config: analysis
          - os: ubuntu-latest
            compiler: clang-17
            sanitizer: None
            config: coverage
          - os: windows-latest
            compiler: msvc
            sanitizer: None
            config: basic
          - os: macos-latest
            compiler: clang
            sanitizer: None
            config: analysis

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ${{ matrix.compiler }} \
          cmake \
          ninja-build \
          valgrind \
          cppcheck \
          clang-tidy \
          clang-format \
          python3-pip
        pip install gcovr cpplint

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake ninja valgrind cppcheck clang-format
        pip3 install gcovr cpplint

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install python3
        pip install cpplint

    - name: Set up MSVC (Windows)
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: 2022

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cmake .. \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSANITIZER_TYPE=${{ matrix.sanitizer }} \
            -DENABLE_COVERAGE=${{ matrix.config == 'coverage' }} \
            -DENABLE_CLANG_TIDY=${{ matrix.config == 'analysis' }} \
            -DENABLE_CPPCHECK=${{ matrix.config == 'analysis' }} \
            -DENABLE_CPPLINT=${{ matrix.config == 'analysis' }} \
            -DENABLE_IWYU=${{ matrix.config == 'analysis' }}
        else
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DSANITIZER_TYPE=${{ matrix.sanitizer }} \
            -DENABLE_COVERAGE=${{ matrix.config == 'coverage' }} \
            -DENABLE_CLANG_TIDY=${{ matrix.config == 'analysis' }} \
            -DENABLE_CPPCHECK=${{ matrix.config == 'analysis' }} \
            -DENABLE_CPPLINT=${{ matrix.config == 'analysis' }} \
            -DENABLE_IWYU=${{ matrix.config == 'analysis' }}
        fi

    - name: Build
      run: |
        cd build
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cmake --build . --config ${{ env.BUILD_TYPE }} --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
        else
          ninja -j${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
        fi

    - name: Run Tests
      run: |
        cd build
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ctest --output-on-failure --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }} -C ${{ env.BUILD_TYPE }}
        else
          ctest --output-on-failure --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
        fi

    - name: Run Static Analysis
      if: matrix.config == 'analysis'
      run: |
        cd build
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cmake --build . --target cpplint || true
        else
          ninja cppcheck cpplint clang-tidy-report iwyu || true
        fi

    - name: Generate Coverage Report
      if: matrix.config == 'coverage'
      run: |
        cd build
        ninja coverage_html || true

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
        path: |
          build/reports/
          build/coverage/
        retention-days: 30

  # Create Release Package
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create Release Package
      run: |
        mkdir -p release-package
        cp -r include/ release-package/
        cp -r examples/ release-package/
        cp -r tests/ release-package/
        cp -r cmake_modules/ release-package/
        cp CMakeLists.txt release-package/
        cp README.md release-package/
        
        # Create comprehensive documentation
        cat > release-package/ANALYSIS_REPORTS.md << 'EOF'
        # Static and Dynamic Analysis Reports
        
        This release includes comprehensive analysis reports from multiple platforms and compilers.
        
        ## Available Reports
        
        ### Static Analysis
        - **Cppcheck**: Static analysis for potential bugs and performance issues
        - **Cpplint**: Google C++ style guide compliance
        - **Clang-tidy**: Modern C++ best practices and bug detection
        - **IWYU**: Include optimization suggestions
        
        ### Dynamic Analysis
        - **Valgrind**: Memory leak detection and profiling
        - **Sanitizers**: Address, Undefined Behavior, Thread, Leak, and Memory sanitizers
        
        ### Code Coverage
        - **HTML Reports**: Interactive coverage reports
        - **Raw Data**: Coverage data for integration with other tools
        
        ## Report Locations
        
        Reports are organized by platform and compiler:
        - `test-results-ubuntu-latest-gcc-13-analysis/`: GCC 13 analysis reports
        - `test-results-ubuntu-latest-clang-17-coverage/`: Clang 17 coverage reports
        - `test-results-windows-latest-msvc-basic/`: MSVC basic test results
        - `test-results-macos-latest-clang-analysis/`: macOS Clang analysis reports
        
        Each directory contains:
        - `reports/`: Static analysis reports (XML, TXT formats)
        - `coverage/`: Code coverage reports (HTML format)
        EOF
        
        # Copy all artifacts to release package
        cp -r artifacts/ release-package/analysis-reports/

    - name: Create Archive
      run: |
        cd release-package
        tar -czf ../stlx-${{ steps.version.outputs.VERSION }}-source.tar.gz .
        cd ..
        zip -r stlx-${{ steps.version.outputs.VERSION }}-source.zip release-package/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: STLX ${{ steps.version.outputs.VERSION }}
        body: |
          # STLX ${{ steps.version.outputs.VERSION }} Release
          
          ## What's New
          - Comprehensive C++23 utilities library
          - Parser combinator library
          - Extended string utilities
          - Complete test suite (47 tests)
          - Multi-platform support (Linux, Windows, macOS)
          - Multi-compiler support (GCC, Clang, MSVC)
          
          ## Downloads
          - **Source Archive**: Complete source code with build system
          - **Analysis Reports**: Comprehensive static and dynamic analysis results
          - **Coverage Reports**: Code coverage analysis across all platforms
          
          ## Build Instructions
          
          ### Basic Build
          ```bash
          mkdir build && cd build
          cmake ..
          make
          ```
          
          ### With Sanitizers
          ```bash
          mkdir build-sanitized && cd build-sanitized
          cmake -DSANITIZER_TYPE=Address ..
          make
          ```
          
          ### With Coverage
          ```bash
          mkdir build-coverage && cd build-coverage
          cmake -DENABLE_COVERAGE=ON ..
          make
          make coverage_html
          ```
          
          ## Test Results
          All tests pass on:
          - Ubuntu (GCC 11-13, Clang 14-17)
          - Windows (MSVC 2019, 2022)
          - macOS (Clang)
          
          ## Analysis Results
          Comprehensive analysis reports included for:
          - Static analysis (cppcheck, cpplint, clang-tidy, IWYU)
          - Dynamic analysis (valgrind, sanitizers)
          - Code coverage (HTML reports)
        files: |
          stlx-${{ steps.version.outputs.VERSION }}-source.tar.gz
          stlx-${{ steps.version.outputs.VERSION }}-source.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
